<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindChamps – Teacher and Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-signin page-login">

  <nav class="topnav" aria-label="Main">
    <a href="main.html">Home</a>
    <a href="login.html">Login</a>
    <a href="https://www.google.com.sg/maps/place/MindChamps+International+PreSchool+@+The+Fort/@14.5443592,121.045355,17z/data=!3m1!4b1!4m5!3m4!1s0x3397c8ef2b9495e1:0x4ae07b96b7534626!8m2!3d14.544354!4d121.047549?shorturl=1">Find Us</a>
  </nav>

  <main class="stage">
    <div class="ladybug">

      <!-- Ladybug artwork -->
      <svg class="ladybug-art" viewBox="0 0 856 420" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <!-- antennae -->
        <path d="M346 36 C350 8 402 2 424 42" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        <path d="M530 36 C526 8 474 2 452 42" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="346" cy="37" rx="11" ry="8" fill="#000"/>
        <ellipse cx="530" cy="37" rx="11" ry="8" fill="#000"/>
        <!-- head -->
        <path d="M273 150 A155 110 0 0 1 583 150 Z" fill="#000"/>
        <!-- body -->
        <path d="M0 420 A428 293 0 0 1 856 420 Z" fill="#7d1418"/>
        <!-- centre triangle -->
        <polygon points="428,127 248,420 608,420" fill="#660509"/>
        <polygon points="428,127 428,420 608,420" fill="#5a0408"/>
        <!-- spots -->
        <g fill="#000">
          <ellipse cx="139" cy="260" rx="31" ry="24"/>
          <ellipse cx="213" cy="333" rx="31" ry="24"/>
          <ellipse cx="50"  cy="367" rx="31" ry="24"/>
          <ellipse cx="302" cy="242" rx="31" ry="24"/>
          <ellipse cx="555" cy="242" rx="31" ry="24"/>
          <ellipse cx="714" cy="260" rx="31" ry="24"/>
          <ellipse cx="651" cy="339" rx="31" ry="24"/>
          <ellipse cx="808" cy="371" rx="31" ry="24"/>
        </g>
      </svg>
      <img class="ladybug-logo" src="images/Full white logo.png" alt="MindChamps">

      <!-- Sign-in form on top of the ladybug -->
      <div class="signin">
        <div id="login-view">
       
          <h1 class="signin-title">LOGIN</h1>

          <form class="signin-form" id="login-form">
            <label class="sr-only" for="role">Account type</label>
            <select id="role" name="role" required>
              <option value="teacher">Teacher</option>
              <option value="admin" selected>Administrator</option>
              <option value="student">Student</option>
            </select>

            <label class="sr-only" for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="Email address" autocomplete="username" required>

            <label class="sr-only" for="pw">Password</label>
            <div class="login-password-field">
              <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
              <button type="button" class="login-password-toggle" data-password-toggle="pw" aria-label="Show password" aria-pressed="false">Show</button>
            </div>

            <button type="submit" class="btn-create">LOG IN</button>
          </form>

          <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
          <a href="#reset-form" id="show-reset" class="login-reset-link">Forgot password?</a>
        </div>
        <form id="reset-form" class="login-reset-form" hidden>
          <h1 class="signin-title">CHANGE PASSWORD</h1>
          <label class="sr-only" for="reset-email">Account email</label>
          <input id="reset-email" name="email" type="email" placeholder="Account email" required>
          <label class="sr-only" for="reset-password">New password</label>
          <div class="login-password-field">
            <input id="reset-password" name="newPassword" type="password" minlength="8" placeholder="New password (8+ characters)" autocomplete="new-password" required>
            <button type="button" class="login-password-toggle" data-password-toggle="reset-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <button type="submit" class="btn-create">SAVE NEW PASSWORD</button>
          <p id="reset-message" class="login-message" role="status" aria-live="polite"></p>
          <button type="button" id="cancel-reset" class="login-reset-back">Back to login</button>
        </form>
      </div>

    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
